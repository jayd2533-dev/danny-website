<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Artist Portfolio</title>
    <!-- Handwritten/Menu Italic Header Font + Clean Technical Mono/Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@1,600;1,700&family=IBM+Plex+Mono:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: #f6f4f0;
            color: #1a1917;
            font-family: 'IBM Plex Mono', monospace;
            overflow: hidden;
            display: flex;
            height: 100vh;
        }

        /* 1. LEFT SIDEBAR NAVIGATION */
        aside {
            width: 260px;
            background-color: #f3f0ea;
            border-right: 1px solid #e2ded5;
            padding: 36px 28px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100%;
            z-index: 20;
            flex-shrink: 0;
            overflow-y: auto;
        }

        .artist-name {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.85rem;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.03em;
            line-height: 1.05;
            margin-bottom: 36px;
            border-bottom: 1px solid #1a1917;
            padding-bottom: 8px;
        }

        .nav-section-title {
            font-family: 'Cormorant Garamond', serif;
            font-size: 1.15rem;
            font-weight: 700;
            font-style: italic;
            text-transform: uppercase;
            letter-spacing: 0.04em;
            margin-top: 22px;
            margin-bottom: 8px;
            color: #1a1917;
        }

        nav ul {
            list-style: none;
        }

        nav li {
            margin-bottom: 6px;
        }

        nav a {
            text-decoration: none;
            color: #55524d;
            font-size: 0.82rem;
            transition: color 0.15s;
            cursor: pointer;
        }

        nav a:hover, nav a.active {
            color: #1a1917;
            text-decoration: underline;
        }

        /* STUDIO CONTROLS (Automatically hidden when exported for the public) */
        .studio-panel {
            margin-top: 30px;
            padding-top: 20px;
            border-top: 1px dashed #c8c3b8;
        }

        body.published-mode .studio-panel,
        body.published-mode .hint {
            display: none !important;
        }

        .upload-zone {
            border: 1.5px dashed #8c867a;
            border-radius: 6px;
            padding: 18px 12px;
            text-align: center;
            cursor: pointer;
            transition: all 0.2s ease;
            background-color: rgba(255, 255, 255, 0.35);
            margin-bottom: 12px;
        }

        .upload-zone:hover, .upload-zone.dragover {
            background-color: #fff;
            border-color: #1a1917;
        }

        .upload-zone p {
            font-size: 0.72rem;
            color: #3d3a35;
            line-height: 1.4;
        }

        .studio-btn {
            width: 100%;
            padding: 9px 10px;
            margin-bottom: 8px;
            background: #1a1917;
            color: #f6f4f0;
            border: none;
            border-radius: 4px;
            font-family: 'IBM Plex Mono', monospace;
            font-size: 0.72rem;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .studio-btn.secondary {
            background: transparent;
            color: #1a1917;
            border: 1px solid #1a1917;
        }

        .studio-btn:hover {
            opacity: 0.8;
        }

        .studio-help {
            font-size: 0.65rem;
            color: #6e6a61;
            line-height: 1.45;
            margin-top: 6px;
        }

        /* 2. MAIN COLLAGE WALL CANVAS */
        main {
            flex-grow: 1;
            position: relative;
            height: 100%;
            overflow: auto;
            background-color: #faf8f5;
        }

        .canvas {
            position: relative;
            width: 2400px;
            height: 1800px;
        }

        /* COLLAGE PHOTOS */
        .piece {
            position: absolute;
            cursor: grab;
            transition: box-shadow 0.2s ease, transform 0.15s ease;
            z-index: 1;
            user-select: none;
            background: #fff;
            padding: 4px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
        }

        .piece:active {
            cursor: grabbing;
        }

        .piece:hover {
            z-index: 60 !important;
            box-shadow: 0 8px 24px rgba(0,0,0,0.16);
        }

        .piece img {
            display: block;
            width: 100%;
            height: auto;
            pointer-events: none;
        }

        /* CONTENT OVERLAYS (About / CV / Contact) */
        .page-overlay {
            position: fixed;
            top: 0;
            left: 260px;
            right: 0;
            bottom: 0;
            background: rgba(250, 248, 245, 0.96);
            padding: 80px 90px;
            z-index: 30;
            display: none;
            overflow-y: auto;
        }

        .page-overlay.active {
            display: block;
        }

        .page-overlay h2 {
            font-family: 'Cormorant Garamond', serif;
            font-size: 2rem;
            font-style: italic;
            text-transform: uppercase;
            margin-bottom: 24px;
            border-bottom: 1px solid #1a1917;
            display: inline-block;
            padding-bottom: 4px;
        }

        .page-overlay p {
            max-width: 580px;
            line-height: 1.75;
            font-size: 0.9rem;
            margin-bottom: 18px;
        }

        /* 3. LIGHTBOX */
        .lightbox {
            position: fixed;
            inset: 0;
            background: rgba(18, 17, 16, 0.92);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            z-index: 100;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
            padding: 40px;
        }

        .lightbox.active {
            opacity: 1;
            pointer-events: auto;
        }

        .lightbox img {
            max-width: 88vw;
            max-height: 82vh;
            box-shadow: 0 12px 40px rgba(0,0,0,0.5);
        }

        .lightbox-caption {
            color: #e6e2da;
            margin-top: 14px;
            font-size: 0.8rem;
            font-style: italic;
        }

        .hint {
            position: fixed;
            top: 20px;
            right: 24px;
            background: rgba(255, 255, 255, 0.9);
            padding: 8px 14px;
            border-radius: 4px;
            font-size: 0.72rem;
            z-index: 25;
            border: 1px solid #dcd8d0;
            pointer-events: none;
        }
    </style>
</head>
<body>

    <!-- LEFT SIDEBAR -->
    <aside>
        <div>
            <!-- Change to your name -->
            <div class="artist-name" contenteditable="true" spellcheck="false">YOUR NAME</div>

            <nav>
                <div class="nav-section-title">
